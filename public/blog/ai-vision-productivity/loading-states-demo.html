<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading States Demo</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #eef1eb;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Preview card ─────────────────────────────────────────────────────── */
.weighbridge-preview {
  width: 320px;
  height: 520px;
  border: 1px solid #d9e1d6;
  border-radius: 18px;
  background: #f6faf7;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ── Loading state ────────────────────────────────────────────────────── */
.weighbridge-preview__loading {
  flex: 1;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 30px;
}

.weighbridge-preview__loading-copy {
  text-align: center;
  color: #526456;
  font-size: 0.95rem;
  width: 100%;
}

.weighbridge-preview__dots {
  display: inline-flex;
  gap: 8px;
  margin-bottom: 14px;
}

.weighbridge-preview__dots span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #526456;
  animation: thinking-bounce 1s infinite ease-in-out;
}

.weighbridge-preview__dots span:nth-child(2) { animation-delay: 0.15s; }
.weighbridge-preview__dots span:nth-child(3) { animation-delay: 0.30s; }

#progressMessage {
  display: inline-block;
  transition: opacity 0.28s ease;
}
#progressMessage.fading { opacity: 0; }

/* ── Document state ───────────────────────────────────────────────────── */
.weighbridge-preview__document {
  flex: 1;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.weighbridge-preview__document-placeholder {
  width: 100%;
  height: 100%;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.line {
  height: 6px;
  border-radius: 3px;
  background: #e8ede7;
}
.line.s  { width: 38%; }
.line.m  { width: 62%; }
.line.l  { width: 82%; }
.line.xl { width: 100%; }

/* ── Keyframe ─────────────────────────────────────────────────────────── */
@keyframes thinking-bounce {
  0%, 80%, 100% { transform: translateY(0);   opacity: 0.6; }
  40%           { transform: translateY(-8px); opacity: 1;   }
}
</style>
</head>
<body>

<div class="weighbridge-preview">

  <!-- Loading state (dots + message) -->
  <div class="weighbridge-preview__loading" id="stateLoading">
    <div class="weighbridge-preview__loading-copy">
      <div class="weighbridge-preview__dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <p><span id="progressMessage">Preparing document</span></p>
    </div>
  </div>

  <!-- Document state (dummy lines) -->
  <div class="weighbridge-preview__document" id="stateDocument">
    <div class="weighbridge-preview__document-placeholder">
      <div class="line s"></div>
      <div class="line xl"></div>
      <div class="line l"></div>
      <div class="line m"></div>
      <div class="line xl"></div>
      <div class="line s"></div>
      <div class="line l"></div>
      <div class="line xl"></div>
      <div class="line m"></div>
      <div class="line l"></div>
      <div class="line s"></div>
      <div class="line xl"></div>
      <div class="line m"></div>
      <div class="line l"></div>
    </div>
  </div>

</div>

<script>
const stateLoading  = document.getElementById('stateLoading');
const stateDocument = document.getElementById('stateDocument');
const progressMsg   = document.getElementById('progressMessage');

// Mocked stage durations (ms)
const STAGE_MS    = 1800;   // each loading message
const DOCUMENT_MS = 3000;   // dummy document hold before loop

const stages = [
  'Preparing document',
  'Reading document',
  'Confirming details',
  'This is taking a little longer than usual. Please wait while we check the document.'
];

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function setMessage(text) {
  progressMsg.classList.add('fading');
  await sleep(280);
  progressMsg.textContent = text;
  progressMsg.classList.remove('fading');
}

async function run() {
  while (true) {
    // Show loading state, cycle through all four messages
    stateDocument.style.display = 'none';
    stateLoading.style.display  = 'flex';

    progressMsg.textContent = stages[0];
    await sleep(STAGE_MS);

    for (let i = 1; i < stages.length; i++) {
      await setMessage(stages[i]);
      await sleep(STAGE_MS);
    }

    // Show dummy document
    stateLoading.style.display  = 'none';
    stateDocument.style.display = 'flex';
    await sleep(DOCUMENT_MS);
  }
}

run();
</script>
</body>
</html>
